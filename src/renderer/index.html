<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'">
  <title>Omada WLAN Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="pre-init">
  <!-- All user-facing text is intentionally absent from this file: it is
       filled in by applyTranslations() (apply-translations.ts) and the view
       renderers. The pre-init class (styles.css) keeps the shell invisible
       until init() (renderer.ts) has applied the translations, so users never
       see empty headings/buttons or a flash of the wrong language -->
  <div class="app-container">
    <!-- Header bar (macOS hidden title bar style): site and controller,
         connection state, last update, controller version, Refresh and
         Connect (status.ts fills the dynamic parts) -->
    <header class="title-bar">
      <div class="title-bar-drag"></div>
      <div class="header-context">
        <span class="site-name" id="siteName" hidden></span>
        <span class="controller-host" id="controllerHost" hidden></span>
      </div>
      <div class="status-section">
        <span class="status-indicator" id="statusIndicator"></span>
        <span class="status-text" id="statusText"></span>
        <span class="status-meta last-updated" id="lastUpdated" hidden></span>
        <span class="status-meta controller-version" id="controllerVersion" hidden></span>
      </div>
      <div class="header-actions">
        <button class="btn btn-icon" id="refreshBtn" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
        <button class="btn btn-primary" id="connectBtn"></button>
      </div>
    </header>

    <div class="app-body">
      <!-- Sidebar: the three views with their total counts, Settings at the
           bottom (shell.ts). The window width picks its form (styles.css,
           spec §4.7): icon + label + count from 1000 px, icon + count
           (labels visually hidden, tooltips) from 800 px, a top view
           switcher below 800 px -->
      <nav class="sidebar" id="viewNav">
        <ul class="nav-list">
          <li>
            <button type="button" class="nav-item" id="navAccessPoints" data-view="accessPoints" aria-current="page">
              <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="2"></circle>
                <path d="M16.24 7.76a6 6 0 0 1 0 8.49"></path>
                <path d="M7.76 16.24a6 6 0 0 1 0-8.49"></path>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                <path d="M4.93 19.07a10 10 0 0 1 0-14.14"></path>
              </svg>
              <span class="nav-label"></span>
              <span class="nav-count" hidden></span>
            </button>
          </li>
          <li>
            <button type="button" class="nav-item" id="navGroups" data-view="groups">
              <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                <polyline points="2 17 12 22 22 17"></polyline>
                <polyline points="2 12 12 17 22 12"></polyline>
              </svg>
              <span class="nav-label"></span>
              <span class="nav-count" hidden></span>
            </button>
          </li>
          <li>
            <button type="button" class="nav-item" id="navNetworks" data-view="networks">
              <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
                <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
              </svg>
              <span class="nav-label"></span>
              <span class="nav-count" hidden></span>
            </button>
          </li>
        </ul>
        <div class="sidebar-footer">
          <button type="button" class="nav-item nav-settings" id="settingsBtn">
            <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <span class="nav-label"></span>
          </button>
        </div>
      </nav>

      <div class="view-area" id="viewArea">
        <!-- Read-only banner of the AP groups and Wi-Fi networks views
             (notices.ts): the precise reason and the fix (spec §4.6), from
             readOnlyReason() in view-state.ts; hidden without data and on
             the Access points view -->
        <div class="view-notice read-only-banner" id="readOnlyBanner" role="note" hidden>
          <svg class="notice-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <p class="notice-text" id="readOnlyBannerText"></p>
        </div>

        <!-- Refresh error (notices.ts): the data on screen is stale; states
             its last-updated time, with Retry (data-state-action, wired in
             renderer.ts) -->
        <div class="view-notice refresh-notice" id="refreshNotice" role="status" hidden>
          <p class="notice-text" id="refreshNoticeText"></p>
          <button type="button" class="btn btn-link notice-action" id="refreshNoticeRetryBtn" data-state-action="retry"></button>
        </div>

        <!-- "Back to …" after following a cross-link to an AP, a group or a
             network (navigation.ts); hidden while the history is empty -->
        <div class="back-bar" id="backBar" hidden>
          <button type="button" class="btn btn-link back-btn" id="backBtn">
            <span class="back-arrow" aria-hidden="true">←</span>
            <span class="back-label" id="backBtnLabel"></span>
          </button>
        </div>

        <!-- Access points view (landing view): the AP list with checkbox
             multi-select (ap-list.ts) and the destination pane
             (destination-pane.ts), whose move button opens the review
             dialog (move-flow.ts, move-dialog.ts). A click on an AP row
             (not its checkbox) opens the AP details pane (ap-details.ts) in
             the destination pane's place until it is closed. Below 800 px
             one pane shows at a time (layout.ts): the list, the destination
             picker ("Choose destination") or the AP details, each drill-in
             pane with its own Back -->
        <section class="view" id="viewAccessPoints">
          <main class="main-content">
            <!-- Access points panel -->
            <section class="panel ap-panel" id="apPanel" aria-labelledby="apPanelTitle">
              <h2 class="panel-title" id="apPanelTitle"></h2>
              <div class="panel-filter ap-filters">
                <input type="text" id="apFilter" class="filter-input">
                <div class="filter-row">
                  <select id="apStatusFilter" class="filter-select"></select>
                  <select id="apGroupFilter" class="filter-select"></select>
                </div>
              </div>
              <div class="selection-toolbar" id="apSelectionToolbar" hidden>
                <button type="button" class="btn btn-link" id="selectAllApsBtn"></button>
                <button type="button" class="btn btn-link" id="clearApSelectionBtn"></button>
              </div>
              <div class="panel-content" id="apList" role="group"></div>
              <div class="ap-panel-footer">
                <p class="selection-summary" id="apSelectionSummary" aria-live="polite"></p>
                <button type="button" class="btn btn-primary drill-only drill-open" id="openDestinationBtn"></button>
              </div>
            </section>

            <!-- Destination pane: a search over group AND network names, one
                 native radio per group (AP groups on Omada 6.3+, WLAN groups
                 before; groups without networks pinned in the "Silence"
                 section), the move preview and the move button -->
            <section class="panel destination-panel" id="destinationPanel" aria-labelledby="destinationPanelTitle">
              <div class="drill-back-bar drill-only">
                <button type="button" class="btn btn-link drill-back" id="destinationBackBtn">
                  <span class="back-arrow" aria-hidden="true">←</span>
                  <span class="drill-back-label"></span>
                </button>
              </div>
              <h2 class="panel-title" id="destinationPanelTitle"></h2>
              <div class="panel-filter">
                <input type="text" id="destinationSearch" class="filter-input">
              </div>
              <div class="panel-content destination-list" id="destinationList" role="group"></div>
              <div class="move-summary">
                <p class="move-status" id="moveStatus" aria-live="polite"></p>
                <div class="move-preview" id="movePreview"></div>
              </div>
              <div class="move-actions">
                <button type="button" class="btn btn-success move-btn" id="moveBtn" disabled></button>
              </div>
            </section>

            <!-- AP details pane: status, MAC, group (a cross-link), clients,
                 the group's Wi-Fi networks (cross-links) and the per-AP
                 overrides statement -->
            <section class="panel detail-panel ap-details-panel" id="apDetailsPanel" aria-labelledby="apDetailsPanelTitle" hidden>
              <div class="drill-back-bar drill-only">
                <button type="button" class="btn btn-link drill-back" id="apDetailsBackBtn">
                  <span class="back-arrow" aria-hidden="true">←</span>
                  <span class="drill-back-label"></span>
                </button>
              </div>
              <div class="panel-header">
                <h2 class="panel-title" id="apDetailsPanelTitle"></h2>
                <button type="button" class="btn btn-link panel-header-action" id="closeApDetailsBtn"></button>
              </div>
              <div class="panel-content detail-content" id="apDetailsContent"></div>
            </section>
          </main>
        </section>

        <!-- AP groups view (read-only, groups-view.ts): the group list with
             its own search, and the selected group's detail (its APs and
             Wi-Fi networks as cross-links). Below 800 px picking a group
             drills into its detail, which has its own Back (layout.ts) -->
        <section class="view" id="viewGroups" aria-labelledby="groupsPanelTitle" hidden>
          <div class="main-content inventory-content">
            <section class="panel master-panel" id="groupMasterPanel" aria-labelledby="groupsPanelTitle">
              <h2 class="panel-title" id="groupsPanelTitle"></h2>
              <div class="panel-filter">
                <input type="text" id="groupSearch" class="filter-input">
              </div>
              <div class="panel-content master-list" id="groupList" role="group"></div>
              <p class="list-summary" id="groupListSummary" aria-live="polite"></p>
            </section>
            <section class="panel detail-panel" id="groupDetailPanel" aria-labelledby="groupDetailPanelTitle">
              <div class="drill-back-bar drill-only">
                <button type="button" class="btn btn-link drill-back" id="groupDetailBackBtn">
                  <span class="back-arrow" aria-hidden="true">←</span>
                  <span class="drill-back-label"></span>
                </button>
              </div>
              <h2 class="panel-title" id="groupDetailPanelTitle"></h2>
              <div class="panel-content detail-content" id="groupDetail"></div>
            </section>
          </div>
        </section>

        <!-- Wi-Fi networks view (read-only, networks-view.ts): the network
             list with each scope ("N groups · M APs") and its own search,
             and the selected network's detail (the groups and APs that
             broadcast it as cross-links). Below 800 px picking a network
             drills into its detail, which has its own Back (layout.ts) -->
        <section class="view" id="viewNetworks" aria-labelledby="networksPanelTitle" hidden>
          <div class="main-content inventory-content">
            <section class="panel master-panel" id="networkMasterPanel" aria-labelledby="networksPanelTitle">
              <h2 class="panel-title" id="networksPanelTitle"></h2>
              <div class="panel-filter">
                <input type="text" id="networkSearch" class="filter-input">
              </div>
              <div class="panel-content master-list" id="networkList" role="group"></div>
              <p class="list-summary" id="networkListSummary" aria-live="polite"></p>
            </section>
            <section class="panel detail-panel" id="networkDetailPanel" aria-labelledby="networkDetailPanelTitle">
              <div class="drill-back-bar drill-only">
                <button type="button" class="btn btn-link drill-back" id="networkDetailBackBtn">
                  <span class="back-arrow" aria-hidden="true">←</span>
                  <span class="drill-back-label"></span>
                </button>
              </div>
              <h2 class="panel-title" id="networkDetailPanelTitle"></h2>
              <div class="panel-content detail-content" id="networkDetail"></div>
            </section>
          </div>
        </section>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsModalHeading">
    <div class="modal">
      <div class="modal-header">
        <h2 id="settingsModalHeading"></h2>
        <button class="btn btn-icon modal-close" id="closeSettingsBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="urlInput"></label>
          <input type="url" id="urlInput" placeholder="https://192.168.1.1:8043">
        </div>
        <div class="form-group">
          <label for="usernameInput"></label>
          <input type="text" id="usernameInput" placeholder="admin@example.com">
        </div>
        <div class="form-group">
          <label for="passwordInput" id="labelPassword"></label>
          <input type="password" id="passwordInput" placeholder="••••••••">
        </div>
        <div class="form-group">
          <label for="languageSelect" id="labelLanguage"></label>
          <select id="languageSelect" class="form-select">
            <option value="es">Español</option>
            <option value="en">English</option>
          </select>
        </div>
        <!-- Trusted controller certificate (TOFU pin): the fingerprint and
             an inline, two-step reset (settings-modal.ts) -->
        <div class="form-group cert-pin-group" role="group" aria-labelledby="labelCertPin">
          <div class="form-label" id="labelCertPin"></div>
          <p class="cert-fingerprint cert-pin-value" id="certPinValue"></p>
          <button class="btn btn-secondary btn-compact" id="resetCertBtn"></button>
          <div class="cert-reset-confirm" id="certResetConfirm" hidden>
            <p id="certResetMessage"></p>
            <div class="cert-reset-actions">
              <button class="btn btn-secondary btn-compact" id="cancelCertResetBtn" aria-describedby="certResetMessage"></button>
              <button class="btn btn-danger btn-compact" id="confirmCertResetBtn" aria-describedby="certResetMessage"></button>
            </div>
          </div>
        </div>
        <!-- Optional Open API management access (settings-modal.ts): Client
             ID, Client Secret (never shown back: "(unchanged)" when one is
             stored), the session-only note, "Remove management access"
             with an inline confirmation (the removal is applied by Save),
             and "Test management access" with its result line
             (management.ts: the checks run in main on the saved settings) -->
        <div class="form-group management-group" role="group" aria-labelledby="managementHeading" aria-describedby="managementHelp">
          <h3 class="form-section-title" id="managementHeading"></h3>
          <p class="form-help" id="managementHelp"></p>
          <div class="form-field">
            <label for="clientIdInput" id="labelClientId"></label>
            <input type="text" id="clientIdInput" autocomplete="off" spellcheck="false">
          </div>
          <div class="form-field">
            <label for="clientSecretInput" id="labelClientSecret"></label>
            <input type="password" id="clientSecretInput" autocomplete="off">
          </div>
          <p class="form-note" id="managementSessionNote" hidden></p>
          <p class="form-note" id="managementRemovalNote" role="status" hidden></p>
          <div class="form-actions">
            <button class="btn btn-secondary btn-compact" id="removeManagementBtn"></button>
            <button class="btn btn-secondary btn-compact" id="undoManagementRemovalBtn" hidden></button>
          </div>
          <div class="cert-reset-confirm" id="managementRemoveConfirm" hidden>
            <p id="managementRemoveMessage"></p>
            <div class="cert-reset-actions">
              <button class="btn btn-secondary btn-compact" id="cancelManagementRemoveBtn" aria-describedby="managementRemoveMessage"></button>
              <button class="btn btn-danger btn-compact" id="confirmManagementRemoveBtn" aria-describedby="managementRemoveMessage"></button>
            </div>
          </div>
          <div class="form-actions management-test-actions">
            <button class="btn btn-secondary btn-compact" id="testManagementBtn" aria-describedby="managementTestResult"></button>
          </div>
          <p class="management-test-result" id="managementTestResult" role="status" hidden></p>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelSettingsBtn"></button>
        <button class="btn btn-primary" id="saveSettingsBtn"></button>
      </div>
    </div>
  </div>

  <!-- Move dialog, one per move flow, in three phases (move-dialog.ts fills
       it): the review (the summary is its description; it opens with focus
       on Cancel, never on the move button: spec §4.7), the progress of the
       one-AP-at-a-time run, and the per-AP results with "Retry failed" -->
  <div class="modal-overlay" id="moveModal" role="dialog" aria-modal="true" aria-labelledby="moveModalHeading" aria-describedby="moveModalSummary">
    <div class="modal modal-move">
      <div class="modal-header">
        <h2 id="moveModalHeading"></h2>
      </div>
      <div class="modal-body">
        <p class="move-modal-summary" id="moveModalSummary" tabindex="-1" aria-live="polite"></p>
        <dl class="move-review" id="moveReview"></dl>
        <ul class="move-results" id="moveResults" hidden></ul>
        <div class="move-notes" id="moveNotes"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="cancelMoveBtn"></button>
        <button type="button" class="btn btn-primary" id="confirmMoveBtn"></button>
        <button type="button" class="btn btn-secondary" id="retryFailedBtn" hidden></button>
        <button type="button" class="btn btn-primary" id="closeMoveBtn" hidden></button>
      </div>
    </div>
  </div>

  <!-- Site Selection Modal (multi-site controllers: the user picks which
       site to manage; site-modal.ts fills the list with one button per site) -->
  <div class="modal-overlay" id="siteModal" role="dialog" aria-modal="true" aria-labelledby="siteModalHeading">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2 id="siteModalHeading"></h2>
      </div>
      <div class="modal-body">
        <p id="siteModalMessage"></p>
        <div class="site-list" id="siteList"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelSiteBtn"></button>
      </div>
    </div>
  </div>

  <!-- Certificate Modal (trust on first use: the first-use confirmation and
       the "certificate changed" notice; cert-modal.ts fills it per open) -->
  <div class="modal-overlay" id="certModal" role="dialog" aria-modal="true" aria-labelledby="certModalHeading" aria-describedby="certModalMessage">
    <div class="modal modal-cert">
      <div class="modal-header">
        <h2 id="certModalHeading"></h2>
      </div>
      <div class="modal-body">
        <p class="cert-message" id="certModalMessage"></p>
        <dl class="cert-details" id="certDetails"></dl>
        <p class="cert-hint" id="certModalHint" hidden></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelCertBtn"></button>
        <button class="btn btn-primary" id="confirmCertBtn"></button>
      </div>
    </div>
  </div>

  <!-- Toast notifications (non-blocking replacement for alert()) -->
  <div class="toast-container" id="toastContainer" role="status" aria-live="polite"></div>

  <script src="renderer.js"></script>
</body>
</html>
